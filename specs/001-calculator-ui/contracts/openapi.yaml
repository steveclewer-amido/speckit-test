openapi: "3.1.0"
info:
  title: Calculator API
  description: |
    Stateless arithmetic REST API.  
    Accepts two operands and an operation, returns the computed result or a domain error.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/calculate:
    post:
      summary: Perform an arithmetic calculation
      operationId: calculate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculationRequest"
            examples:
              add:
                summary: Add two numbers
                value: { "a": 2, "b": 3, "operation": "ADD" }
              subtract:
                summary: Subtract two numbers
                value: { "a": 10, "b": 4, "operation": "SUBTRACT" }
              multiply:
                summary: Multiply two numbers
                value: { "a": 6, "b": 7, "operation": "MULTIPLY" }
              divide:
                summary: Divide two numbers
                value: { "a": 8, "b": 2, "operation": "DIVIDE" }
      responses:
        "200":
          description: Calculation succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculationResponse"
              example:
                result: 5.0
        "400":
          description: |
            Validation failure (missing or non-numeric input, unrecognised operation)
            or domain error (division by zero).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingField:
                  summary: Missing operand
                  value: { "error": "Field 'a' must not be null." }
                divisionByZero:
                  summary: Division by zero
                  value: { "error": "Division by zero is not allowed." }

components:
  schemas:
    Operation:
      type: string
      enum: [ADD, SUBTRACT, MULTIPLY, DIVIDE]
      description: The arithmetic operation to apply.

    CalculationRequest:
      type: object
      required:
        - a
        - b
        - operation
      properties:
        a:
          type: number
          format: double
          description: First operand.
          example: 6
        b:
          type: number
          format: double
          description: Second operand.
          example: 7
        operation:
          $ref: "#/components/schemas/Operation"

    CalculationResponse:
      type: object
      required:
        - result
      properties:
        result:
          type: number
          format: double
          description: The computed result.
          example: 42.0

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable description of the error.
          example: "Division by zero is not allowed."
