server.port=8080
server.error.whitelabel.enabled=false

# In-memory user store credentials (password uses {bcrypt} delegating encoder prefix)
app.security.username=admin
app.security.password={noop}password

# H2 file-based datasource (persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/calchistory
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# H2 web console (disabled)
spring.h2.console.enabled=false
